# Project settings. Every path is relative to the repository root and is
# resolved through src/config.py, never from the working directory.

paths:
  raw_data_dir: data/raw
  splits_dir: data/splits
  results_dir: results
  # {stem} is the ARFF file name without extension, e.g. 5year.
  test_indices_pattern: data/splits/{stem}_test_indices.csv
  train_indices_pattern: data/splits/{stem}_train_indices.csv
  # {scorer} is one of the five scorer names in src/evaluate.py.
  oof_predictions_pattern: results/oof/{stem}_{scorer}.csv
  metrics_dir: results/metrics

# Published UCI counts for each raw file, before duplicate removal. load.py
# refuses a file that does not match.
raw_counts:
  1year: {rows: 7027, bankrupt: 271}
  2year: {rows: 10173, bankrupt: 400}
  3year: {rows: 10503, bankrupt: 495}
  4year: {rows: 9792, bankrupt: 515}
  5year: {rows: 5910, bankrupt: 410}

seeds:
  nominated: 42
  models: [42, 43, 44, 45, 46]

bootstrap:
  seed: 42
  n_resamples: 2000

# Miss to false alarm cost ratios for the cost thresholds and Figure 3: a
# missed bankruptcy costs this many times a false alarm.
cost_ratios: [5, 10, 20, 50]

split:
  test_size: 0.2

cv:
  n_folds: 5
  n_repeats: 3
  inner_val_fraction: 0.15

# Inverse regularisation strengths tried for the refitted Z' and the logistic
# regression on all 64 ratios.
baselines:
  c_grid: [0.01, 0.1, 1, 10]

num_threads: 4
